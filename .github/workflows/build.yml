name: Pro prototype build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Check documentation and reference archives
        run: python3 scripts/ci/check_docs.py
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Test engine and core, lint app, build debug APK
        run: bash ./gradlew :engine:test :core:transport:test :core:fastboot:test :core:adb:test :core:diagnostics:test :app:lintDebug :app:assembleDebug --no-daemon --stacktrace
      - name: Summarize test results
        if: always()
        run: python3 scripts/ci-test-summary.py
      - name: Upload prototype APK
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: NekoFlash-Pro-prototype-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload test results and build/testing guide
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: NekoFlash-Pro-test-results-${{ github.run_number }}
          path: |
            build/verification/test-summary.md
            engine/build/test-results/test/TEST-*.xml
            core/transport/build/test-results/test/TEST-*.xml
            core/fastboot/build/test-results/test/TEST-*.xml
            core/adb/build/test-results/test/TEST-*.xml
            core/diagnostics/build/test-results/test/TEST-*.xml
            engine/build/reports/tests/test/
            core/transport/build/reports/tests/test/
            core/fastboot/build/reports/tests/test/
            core/adb/build/reports/tests/test/
            core/diagnostics/build/reports/tests/test/
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
            docs/07_BUILD_AND_TESTING.md
          if-no-files-found: error
          retention-days: 14
