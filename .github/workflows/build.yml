name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Ручной запуск даёт вердикт заново без пустого коммита.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, lint and assemble
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # Быстрые проверки стоят до Gradle: они занимают секунды и ловят то, из-за
      # чего иначе пришлось бы ждать всю сборку.
      - name: Documentation and reference archives
        run: python3 scripts/ci/check_docs.py

      - name: Repository hygiene
        run: ./scripts/ci/check_repository_hygiene.sh

      - name: Localization contract
        run: python3 ./scripts/ci/check_localization.py

      - name: Kotlin style, complexity and module boundaries
        run: ./scripts/ci/check_kotlin_style.sh

      - name: Compose wiring
        run: python3 ./scripts/ci/check_compose_wiring.py

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0 ndk;28.2.13676358 cmake;3.22.1'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      # Без постоянного ключа каждая сборка подписана заново: поверх прежней она
      # не ставится, а удаление приложения уносит ключ хоста ADB. Секрета может не
      # быть — тогда сборка остаётся с временным ключом. Ключ пишется во временный
      # каталог раннера и в дерево не попадает.
      - name: Materialise the debug signing key
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.NEKOFLASH_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${DEBUG_KEYSTORE_BASE64:-}" ]; then
            echo "debug signing: secret is not set, the build keeps a throwaway key"
            exit 0
          fi
          keystore="$RUNNER_TEMP/nekoflash-debug.keystore"
          printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 -d > "$keystore"
          echo "NEKOFLASH_DEBUG_KEYSTORE=$keystore" >> "$GITHUB_ENV"
          echo "debug signing: using the stable key from the repository secret"

      - name: Test, lint and build debug APK
        run: ./gradlew test lint assembleDebug --no-daemon --stacktrace

      - name: Summarize test results
        if: always()
        run: python3 scripts/ci-test-summary.py

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: NekoFlash-Pro-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload test results and build/testing guide
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: NekoFlash-Pro-test-results-${{ github.run_number }}
          path: |
            build/verification/test-summary.md
            **/build/test-results/**
            **/build/reports/**
            docs/07_BUILD_AND_TESTING.md
          if-no-files-found: ignore
          retention-days: 14
