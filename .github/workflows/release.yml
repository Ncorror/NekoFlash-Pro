name: Release APK

# Выпуск (D074): две независимые сборки release одного коммита должны совпасть
# побайтно, затем — подпись ключом из секрета. Запускается тегом `v*` или
# вручную; обычная проверка ветки — в build.yml.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Reproducible release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0 ndk;28.2.13676358 cmake;3.22.1'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      # Ключа может не быть — тогда выпуск остаётся неподписанным. Хранилище
      # пишется во временный каталог раннера и в дерево не попадает.
      - name: Materialise the release signing key
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.NEKOFLASH_RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${RELEASE_KEYSTORE_BASE64:-}" ]; then
            echo "release signing: secret is not set, the release stays unsigned"
            exit 0
          fi
          keystore="$RUNNER_TEMP/nekoflash-release.keystore"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$keystore"
          echo "NEKOFLASH_RELEASE_KEYSTORE=$keystore" >> "$GITHUB_ENV"

      - name: Build twice, compare and sign
        env:
          NEKOFLASH_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.NEKOFLASH_RELEASE_KEYSTORE_PASSWORD }}
          NEKOFLASH_RELEASE_KEY_ALIAS: ${{ secrets.NEKOFLASH_RELEASE_KEY_ALIAS }}
          NEKOFLASH_RELEASE_KEY_PASSWORD: ${{ secrets.NEKOFLASH_RELEASE_KEY_PASSWORD }}
        run: ./scripts/ci/release_apk.sh

      - name: Upload release APK
        uses: actions/upload-artifact@v6
        with:
          name: NekoFlash-Pro-release-${{ github.run_number }}
          path: build/release/
          if-no-files-found: error
          retention-days: 90
